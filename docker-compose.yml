services:
  server:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TICK_MS: ${TICK_MS:-3000}
      STARTING_CASH: ${STARTING_CASH:-100000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - stock-data:/app/data
    restart: unless-stopped

  client:
    build: ./client
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  stock-data:
